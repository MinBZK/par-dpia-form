name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parassessment
          POSTGRES_PASSWORD: parassessment
          POSTGRES_DB: parassessment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable corepack & pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0+sha512.f00082e5b283a199b74e079da28d155c008fe232f44c8a06ea7ddfa014ecf719fc362f790ecc67b28106ddac2afb24c49a9a079159da560b2ce7d1e98efd11af --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CSP inline-style guard (#326)
        run: pnpm check:csp

      - name: v-html sink guard
        run: pnpm check:vhtml

      - name: Public runtime config guard
        run: pnpm check:config

      - name: Security header baseline guard
        run: pnpm check:headers

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true

      - name: security.txt guard
        run: pnpm check:securitytxt

      - name: Security audit (production dependencies)
        run: pnpm audit --prod --audit-level high

      - name: Third-party licence list guard
        run: pnpm check:licenses

      - name: Generate assessment JSON sources
        run: |
          mkdir -p sources/generated
          uv run --frozen python script/run_all.py \
            --schema schemas/assessment-definition.v2.schema.json \
            --source sources/prescan.yaml \
            --begrippen-yaml sources/begrippenkader_dpia.yaml \
            --output-json sources/generated/PreScanDPIA.json
          uv run --frozen python script/run_all.py \
            --schema schemas/assessment-definition.v2.schema.json \
            --source sources/dpia.yaml \
            --begrippen-yaml sources/begrippenkader_dpia.yaml \
            --output-json sources/generated/DPIA.json
          uv run --frozen python script/run_all.py \
            --schema schemas/assessment-definition.v2.schema.json \
            --source sources/iama.yaml \
            --begrippen-yaml sources/begrippenkader_iama.yaml \
            --output-json sources/generated/IAMA.json \
            --definitions-once-per-page

      - name: Run Python pipeline tests
        run: uv run --frozen pytest script/tests -q

      - name: Type check backend
        run: cd apps/boekhouding-backend && npx tsc --noEmit

      - name: Type check frontend
        run: cd apps/boekhouding-frontend && npx vue-tsc --noEmit

      - name: Type check standalone form
        run: cd apps/standalone-form && npx vue-tsc --noEmit

      - name: Run tests (alle workspaces)
        env:
          TEST_DATABASE_URL: postgresql://parassessment:parassessment@localhost:5432/parassessment_test
        run: pnpm -r --if-present test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            packages/*/coverage
            apps/*/coverage
          if-no-files-found: ignore
          retention-days: 14
