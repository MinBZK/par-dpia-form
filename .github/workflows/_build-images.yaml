name: Build images (reusable)

# Build and scan first, publish second. The image that is pushed is the one the
# scan ran against: it travels between the jobs as a tarball rather than being
# rebuilt, so a vulnerable image can never reach the registry.

on:
  workflow_call:
    inputs:
      frontend-image:
        required: true
        type: string
      backend-image:
        required: true
        type: string
      tag-prefix:
        required: false
        type: string
        default: ''
      tag-latest:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false
    outputs:
      frontend-image:
        value: ${{ jobs.image-refs.outputs.frontend-image }}
      backend-image:
        value: ${{ jobs.image-refs.outputs.backend-image }}

jobs:
  generate-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Generate JSON from YAML definitions
        run: ./script/generate_sources.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-sources
          path: sources/generated/
          retention-days: 1

  # Read-only token: the third-party scanner never runs beside a credential that
  # can write to GHCR. Deliberately no layer cache, because a cached
  # `apk upgrade` would scan older packages than a real build produces.
  build-and-scan:
    needs: generate-sources
    # Without this the image name lands in the job name too, and the required
    # status check would carry a registry path in its title.
    name: build-and-scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ${{ inputs.backend-image }}
          - component: frontend
            image: ${{ inputs.frontend-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-sources
          path: sources/generated/
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/${{ matrix.component }}/Containerfile
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: localhost/${{ matrix.component }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      # One scan either way, in the format that fits the reader. A pull request
      # gets a table in the log; main feeds the Security tab, which is where the
      # weekly digest reads from. Both fail on a fixable CRITICAL or HIGH.
      #
      # ignore-unfixed keeps that actionable: it only fails when the distro has
      # published a patched version, so a red run always has something someone
      # can do.
      - name: Trivy image scan
        if: github.event_name != 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.33.1
        with:
          image-ref: localhost/${{ matrix.component }}:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy image scan (SARIF)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.33.1
        with:
          image-ref: localhost/${{ matrix.component }}:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
      - name: Upload Trivy results to Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Export the scanned image
        if: inputs.publish
        run: docker save "localhost/${{ matrix.component }}:${{ github.sha }}" -o /tmp/image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.publish
        with:
          name: image-${{ matrix.component }}
          path: /tmp/image.tar
          retention-days: 1

  publish:
    needs: build-and-scan
    if: inputs.publish
    name: publish (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ${{ inputs.backend-image }}
          - component: frontend
            image: ${{ inputs.frontend-image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.component }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ inputs.tag-prefix }}
            type=raw,value=latest,enable=${{ inputs.tag-latest }}
      - name: Tag and push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LOCAL: localhost/${{ matrix.component }}:${{ github.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$LOCAL" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  image-refs:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      frontend-image: ${{ steps.refs.outputs.frontend-image }}
      backend-image: ${{ steps.refs.outputs.backend-image }}
    steps:
      - id: refs
        env:
          FRONTEND: ${{ inputs.frontend-image }}
          BACKEND: ${{ inputs.backend-image }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          echo "frontend-image=${FRONTEND}:${PREFIX}${short}" >> "$GITHUB_OUTPUT"
          echo "backend-image=${BACKEND}:${PREFIX}${short}" >> "$GITHUB_OUTPUT"
