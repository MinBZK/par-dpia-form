name: Image scan

# Runs on every pull request, including bot and fork ones, and builds without
# pushing. The scan inside the deploy path only covers builds that actually
# deploy, and since previews are opt-in per label that is no longer most PRs.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        if: matrix.component == 'frontend'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Generate JSON from YAML definitions
        if: matrix.component == 'frontend'
        run: ./script/generate_sources.sh

      # Built and scanned in one job: a locally loaded image does not survive
      # into another runner. Deliberately no layer cache: a cached `apk upgrade`
      # would scan yesterday's packages instead of what a real build produces.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/${{ matrix.component }}/Containerfile
          push: false
          load: true
          tags: scan-target/${{ matrix.component }}:${{ github.sha }}

      # ignore-unfixed keeps this actionable: it only fails when a patched
      # version exists, so a red run always has something someone can do.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.33.1
        with:
          image-ref: scan-target/${{ matrix.component }}:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
