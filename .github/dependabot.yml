version: 2
updates:
  # GitHub Actions — also bumps hash-pinned actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm — all workspaces via the root lockfile
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a release age before adopting it: a compromised npm publish is
    # usually caught within days. Security updates ignore the cooldown, so a
    # patch for a known vulnerability still arrives immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # vue-tsc 2.2.x sets a TypeScript peer ceiling; let bumps go via a
      # deliberate PR instead of an automatic major TypeScript update.
      - dependency-name: "typescript"

  # Python build pipeline (uv lockfile)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-dependencies:
        patterns:
          - "*"

  # Container base images — one entry covers every Containerfile directory.
  # Daily, unlike the rest: a base image digest is how OS-level patches reach
  # us, and the image scan blocks merges on exactly those findings.
  - package-ecosystem: "docker"
    directories:
      - "/containers/backend"
      - "/containers/frontend"
      - "/containers/standalone"
    schedule:
      interval: "daily"
    groups:
      container-images:
        patterns:
          - "*"

  # Images referenced in the compose files (postgres, keycloak, ...)
  - package-ecosystem: "docker-compose"
    directory: "/containers"
    schedule:
      interval: "weekly"
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      # ZAD/production runs on PostgreSQL 17; do not propose major bumps to
      # 18+ (the data volume does not auto-upgrade across a major version).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
