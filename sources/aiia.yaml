        description: >-
          Als je een van de onderstaande vragen met 'ja' beantwoordt, neem dan de
          nodige transparantiemaatregelen (artikel 50 AI-verordening). Dat wil
          over het algemeen zeggen: zorg dat gebruikers weten dat ze met een
          AI-systeem te maken hebben.
        type:
