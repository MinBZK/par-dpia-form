      - task: Uitzonderingen
        id: "8.4"
        is_official_id: false
        description: |
          Als het systeem uitsluitend van toepassing is op een van de volgende terreinen, zijn de reguliere vragen in het AIIA afdoende. Let op: dit geldt alleen wanneer het AI-systeem individuen niet profileert. Anders is het systeem altijd een hoog-risicotoepassing (artikel 6, lid 3, AI-verordening).

          Uitzonderingen, AI voor:
          <ol>
            <li>Militaire doeleinden</li>
            <li>Rechtshandhaving en justitie</li>
            <li>Onderzoek naar AI</li>
            <li>Open source AI in de ontwikkelingsfase (vóór markttoetreding)</li>
            <li>Non-professionele activiteiten</li>
            <li>Het AI-systeem beïnvloedt de uitkomst van de besluitvorming niet wezenlijk. Denk aan een systeem dat louter procedurele taken vervult of dient als controle en verbetering van een eerdere menselijke activiteit (bijvoorbeeld door taalverbetering). Ook systemen die functioneren ter opsporing van besluitvormingspatronen vallen hieronder.</li>
          </ol>

          Nota bene: nog veel definities rondom AI-toepassingen worden uitgewerkt. Daarom is het mogelijk dat na het invullen van deze vragen nog niet helemaal duidelijk is in welke categorie het AI-systeem valt. Je kan overwegen om deze vraag en andere voor te leggen aan de Regulatory Sandbox AI van de Rijksoverheid.
        type:
          - task_group
        repeatable: false
        tasks:
          - task: >-
              Is een van bovenstaande uitzonderingen van toepassing? Zo ja, welke en waarom?
            id: "8.4.1"
            is_official_id: false
            type:
              - open_text
            repeatable: false

  - task: "Bijlage 2: Hoog-risicosystemen"
    id: "9"
    is_official_id: false
    description: >-
      Is het AI-systeem een hoog-risicotoepassing (zie Bijlage 1)? Gebruik dan de
      volgende additionele vragen als hulpmiddel. Op deze manier neem je de juiste
      waarborgen om het AI-systeem op een verantwoorde manier te gebruiken. De
      AI-verordening beschrijft verschillende partijen die ieder hun eigen rol en
      verantwoordelijkheid hebben rondom een AI-systeem. In deze bijlage staan de
      vragen voor de gebruiker (gebruiksverantwoordelijke) en de ontwikkelaar
      (aanbieder) van een AI-systeem.
    type:
      - task_group
    repeatable: false
    tasks:
      - task: Vragen indien je gebruik wil maken van een hoog-risico-AI-systeem
        id: "9.1"
        is_official_id: false
        description: >-
          Volgens de AI-verordening moeten hoog-risicosystemen aan een aantal
          eisen voldoen. De onderstaande vragen helpen daarbij.
        type:
          - task_group
        repeatable: false
        tasks:
          - task: Effecten
            id: "9.1.1"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Vormt het AI-systeem een significant risico voor de gezondheid, veiligheid of
                  fundamentele rechten van personen? Beredeneer waarom wel of niet.
                description: >-
                  Artikel 6, punt 2a, AI-verordening.
                id: "9.1.1.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Onderhoud en beheer
            id: "9.1.2"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: Hoe is monitoring en werking van het AI-systeem geborgd?
                description: >-
                  Artikel 26, lid 5, AI-verordening.
                id: "9.1.2.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: Hoe worden de logs die het AI-systeem produceert ten minste 6 maanden bewaard?
                description: >-
                  Artikel 26, lid 6, AI-verordening.
                id: "9.1.2.2"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Zijn er maatregelen getroffen om menselijk toezicht te regelen door personen met
                  de benodigde bekwaamheid, opleiding en autoriteit?
                id: "9.1.2.3"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Technische robuustheid
            id: "9.1.3"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Is de input(data) relevant en representatief, rekening houdende met het beoogde
                  doel van het AI-systeem?
                description: >-
                  Artikel 26, lid 4, AI-verordening.
                id: "9.1.3.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: Is het AI-systeem voorzien van de technische documentatie?
                description: >-
                  Bijlage IV, AI-verordening.
                id: "9.1.3.2"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Is het voor het menselijk toezicht mogelijk de output(data) op de juiste wijze te
                  controleren, interpreteren, of eventueel te negeren?
                description: >-
                  Artikel 14, lid 4, AI-verordening.
                id: "9.1.3.3"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Betrouwbaarheid
            id: "9.1.4"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Zijn de niveaus van maatstaven voor nauwkeurigheid vermeld in de
                  gebruikersaanwijzingen?
                id: "9.1.4.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Data governance
            id: "9.1.5"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: Voldoet de trainingsdata van het AI-systeem aan de kwaliteitseisen?
                description: |
                  Het gaat om de volgende kwaliteitseisen:
                  <ul>
                    <li>Relevante ontwerpkeuzes voor datasets.</li>
                    <li>Inzichtelijk maken wat de herkomst van data is.</li>
                    <li>Relevante verwerkingsactiviteiten zoals annotatie, labelen, opschoning, actualisatie, verrijking en aggregatie.</li>
                    <li>Het opstellen van aannames die de data moet meten en vertegenwoordigen.</li>
                    <li>Een beoordeling van de beschikbaarheid, kwantiteit en geschiktheid van de benodigde datasets.</li>
                    <li>Een beoordeling van mogelijke vooringenomenheid van de data met negatieve gevolgen voor gezondheid, veiligheid, grondrechten en discriminatie.</li>
                    <li>Maatregelen om vooringenomenheid op te sporen, te voorkomen en te beperken.</li>
                    <li>Identificeren en aanpakken van tekortkomingen die naleving van de regelgeving belemmeren.</li>
                  </ul>
                id: "9.1.5.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Risicobeheer
            id: "9.1.6"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Hoe is het AI-systeem getest op het beoogde doel en is dat in overeenstemming met
                  de risicobeheerseisen voordat het in gebruik wordt genomen?
                id: "9.1.6.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: Is er een risicobeheersysteem vastgesteld en gedocumenteerd?
                description: |
                  Een risicobeheersysteem bestaat uit de volgende stappen:
                  <ul>
                    <li>Een risicoanalyse van het AI-systeem voor de gezondheid, veiligheid of grondrechten.</li>
                    <li>Een inschatting en evaluatie van de risico's die zich kunnen voordoen.</li>
                    <li>Een evaluatie van nieuwe risico's na markttoetreding, op basis van het monitoringsysteem van het AI-systeem.</li>
                    <li>Het opstellen van risicobeheersmaatregelen.</li>
                  </ul>
                id: "9.1.6.2"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Hoe waarborg je eventuele samenwerking met de toezichthouders en andere bevoegde
                  autoriteiten?
                description: >-
                  Denk aan contactpersonen en bereikbaarheid. Artikel 26, lid 12, AI-verordening.
                id: "9.1.6.3"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Is het waarschijnlijk dat kwetsbare groepen (zoals kinderen) toegang zullen
                  hebben tot het AI-systeem?
                description: >-
                  In dat geval moeten de risicobeheersmaatregelen extra worden aangescherpt.
                id: "9.1.6.4"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Communicatie
            id: "9.1.7"
            is_official_id: false
            description: >-
              Nota bene: het AI-bureau ontwikkelt een sjabloon voor een
              vragenlijst, onder meer via een geautomatiseerd instrument, om
              gebruiksverantwoordelijken te helpen deze verplichtingen op
              vereenvoudigde wijze na te komen.
            type:
              - task_group
            repeatable: false
            tasks:
              - task: Hoe communiceer je over de ingebruikneming van het hoog-risico-AI-systeem?
                description: >-
                  Artikel 26, lid 7, AI-verordening.
                id: "9.1.7.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Is het AI-systeem geregistreerd in de EU-databank voor hoog-risicosystemen of in
                  het Nederlandse algoritmeregister?
                description: >-
                  Hoog-risico-AI-systemen met een kritieke-infrastructuurtoepassing
                  dienen altijd in het algoritmeregister gepubliceerd te worden.
                  Artikel 26, lid 8, en artikel 49 en 71, AI-verordening.
                id: "9.1.7.2"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: Zijn er gebruiksinstructies opgesteld?
                description: |
                  Gebruiksinstructies moeten ten minste het volgende bevatten (artikel 13, lid 2 en 3, AI-verordening):
                  <ul>
                    <li>De identiteit en contactgegevens van de aanbieder.</li>
                    <li>Kenmerken, capaciteiten en beperkingen (doel).</li>
                    <li>Mogelijke toekomstige wijzigingen.</li>
                    <li>Maatregelen omtrent menselijk toezicht.</li>
                    <li>De benodigde rekenkracht en hardware, verwachte levensduur, en de noodzakelijke maatregelen (en de frequentie daarvan) voor onderhoud en verzorging.</li>
                    <li>Een beschrijving van de mechanismen in het AI-systeem.</li>
                    <li>De niveaus van nauwkeurigheid en de relevante maatstaven voor de nauwkeurigheid.</li>
                  </ul>
                id: "9.1.7.3"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Generatieve AI
            id: "9.1.8"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Is er sprake van informatie en documentatie waarmee de mogelijkheden en
                  limitaties van het AI-systeem duidelijk worden?
                id: "9.1.8.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: Is er beleid hoe auteursrechten worden gewaarborgd door het AI-systeem?
                id: "9.1.8.2"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
              - task: >-
                  Is er een gedetailleerde samenvatting over de content waarmee het AI-systeem is
                  getraind?
                id: "9.1.8.3"
                is_official_id: false
                type:
                  - open_text
                repeatable: false
          - task: Overig
            id: "9.1.9"
            is_official_id: false
            type:
              - task_group
            repeatable: false
            tasks:
              - task: >-
                  Indien er gebruik wordt gemaakt van biometrische identificatie op afstand, is er
                  toestemming van een gerechtelijke instantie?
                description: >-
                  Artikel 26, lid 10, AI-verordening.
                id: "9.1.9.1"
                is_official_id: false
                type:
                  - open_text
                repeatable: false

      - task: Vragen voor ontwikkelaars (aanbieders) van hoog-risico-AI-systemen
        id: "9.2"
        is_official_id: false
        description: >-
          Ontwikkelaars (of zoals in de AI-verordening: aanbieders) van een
          hoog-risico-AI-systeem moeten ook onderstaande vragen beantwoorden. Een
          aanbieder is een natuurlijke of rechtspersoon, overheidsinstantie,
          agentschap of ander orgaan die een AI-systeem of AI-model voor algemene
          doeleinden ontwikkelt of laat ontwikkelen en dat systeem of model in de
          handel brengt of in gebruik stelt onder de eigen naam of merk.
        type:
          - task_group
        repeatable: false
        tasks:
          - task: Is er documentatie opgesteld waarin de naleving van vereisten gedocumenteerd is?
            description: >-
              Zie bijlage IV van de AI-verordening voor de vereisten.
            id: "9.2.1"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: >-
              Op welke wijze is technische documentatie vindbaar voor gebruikers, ook als er
              geen betrokkenheid is bij de uitrol van je systeem?
            id: "9.2.2"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: Is vermeld, en zo ja op welke wijze, dat het een hoog-risicosysteem is?
            description: >-
              Artikel 16, AI-verordening.
            id: "9.2.3"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: Is er een kwaliteitsbeheersysteem opgezet?
            description: |
              Ook dit dien je te documenteren (artikel 17, AI-verordening). Daarvoor is ten minste nodig:
              <ul>
                <li>Een nalevingsstrategie van de regelgeving</li>
                <li>Ontwerpprocedures</li>
                <li>Kwaliteitscontroleprocedures</li>
                <li>Een inspectieprocedure</li>
                <li>Een overzicht van de technische eisen en wat ervoor nodig is om die te handhaven</li>
                <li>Databeheerprocedures</li>
                <li>Een risicomanagementsysteem</li>
                <li>Een monitoringsprocedure</li>
                <li>Een procedure voor het melden van ernstige incidenten</li>
                <li>Een communicatiestrategie met de bevoegde autoriteiten</li>
                <li>Systemen en procedures voor de registratie van relevante documentatie</li>
                <li>Het beheer van hulpmiddelen en voorzieningszekerheid</li>
                <li>Een verantwoordingskader</li>
              </ul>
            id: "9.2.4"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: Hoe worden de logs van het AI-systeem bewaard?
            description: >-
              Artikel 19, AI-verordening.
            id: "9.2.5"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: >-
              Is er een conformiteitsbeoordelingsprocedure en is deze vastgesteld in een
              EU-conformiteitsverklaring?
            description: >-
              Hierin wordt aangetoond of er voldaan is aan de vastgestelde eisen
              voor het AI-systeem. Deze moet worden voorgelegd aan een aangewezen
              instantie en ten minste 10 jaar bewaard worden. Artikel 43 en 47,
              AI-verordening.
            id: "9.2.6"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: Is de relevante toezichthouder akkoord met de conformiteitsverklaring?
            description: >-
              Dit hoeft alleen als het hoog-risico-AI-systeem betrekking heeft op
              een relevant hoog-risicoproduct (bijlage I). Artikel 16, lid k,
              AI-verordening.
            id: "9.2.7"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: >-
              Is er, indien het AI-systeem aan de AI-verordening meent te voldoen, een
              CE-markering aangebracht, bijvoorbeeld in de documentatie?
            description: >-
              Artikel 48, AI-verordening.
            id: "9.2.8"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: >-
              Hoe worden, indien het AI-systeem niet meer in overeenstemming is met de
              AI-verordening, corrigerende maatregelen genomen, zoals het systeem uit de handel
              nemen, deactiveren of terugroepen? Op welke wijze worden gebruikers hiervan op de
              hoogte gesteld?
            description: >-
              Artikel 20, AI-verordening.
            id: "9.2.9"
            is_official_id: false
            type:
              - open_text
            repeatable: false
          - task: Voldoet het systeem aan de Europese toegankelijkheidseisen?
            description: >-
              Richtlijnen (EU) 2016/2102 en (EU) 2019/882.
            id: "9.2.10"
            is_official_id: false
            type:
              - open_text
            repeatable: false

  - task: "Bijlage 3: Aandachtspunten generatieve AI"
    id: "10"
    is_official_id: false
    type:
      - task_group
      - informational
    repeatable: false
    tasks:
      - task: Wat is generatieve AI?
        id: "10.1"
        is_official_id: false
        description: |
          Generatieve AI is een vorm van AI waarbij algoritmes worden ingezet om content te genereren. Het kabinet schrijft in haar <a href="https://www.tweedekamer.nl/kamerstukken/brieven_regering/detail?id=2024Z00480&did=2024D01191" target="_blank">Overheidsbrede visie op generatieve AI</a> dat generatieve AI in dienst moet staan van het vergroten van het menselijk welzijn en autonomie, duurzaamheid, welvaart, rechtvaardigheid en veiligheid.

          Onder de motorkap maakt generatieve AI gebruik van een neuraal netwerk dat bestaat uit biljoenen parameters. Welke output gekozen wordt is op basis van statistiek; er zit geen logica of kennis over de werkelijkheid achter. De output wisselt en is moeilijk te reproduceren of te verantwoorden. Dit is gelijk het belangrijkste aandachtspunt voor het invullen van het AIIA: <strong>gebruik generatieve AI alleen als het acceptabel is dat de uitkomst niet uitlegbaar of controleerbaar is.</strong>

          <strong>Voorlopig standpunt voor Rijksorganisaties: in beginsel niet toegestaan.</strong> Het <a href="https://www.rijksoverheid.nl/actueel/nieuws/2023/12/11/voorlopig-standpunt-generatieve-ai-kabinet" target="_blank">voorlopig standpunt</a> stelt: "Niet-gecontracteerde generatieve AI-toepassingen zoals ChatGPT, Bard en Midjourney, voldoen over het algemeen niet aantoonbaar aan de geldende privacy- en auteursrechtelijke wetgeving. Zodoende is het gebruik hiervan door Rijksorganisaties (of in opdracht daarvan) in beginsel niet toegestaan, in die gevallen waarin het risico bestaat dat wetgeving wordt overtreden, tenzij de aanbieder en de gebruiker aantoonbaar voldoen aan de geldende wet- en regelgeving."
        type:
          - task_group
        repeatable: false

      - task: Aandachtspunten bij Deel A (doel, noodzaak en afweging)
        id: "10.2"
        is_official_id: false
        description: |
          <ul>
            <li><strong>Publieke waarden</strong>: er zijn geen specifieke aandachtspunten voor generatieve AI. Vaak komen transparantie, uitlegbaarheid en duurzaamheid in het gedrang bij de keuze voor generatieve AI.</li>
            <li><strong>Grondrechten</strong>: ga na of het model op ethische wijze is getraind en 'gefinetuned'. In deze laatste stap wordt menselijke feedback gebruikt om de antwoorden te verbeteren. De werkomstandigheden van deze mensen ('click workers') zijn niet altijd even goed.</li>
            <li><strong>Duurzaamheid</strong>: ga na of met een minder complex systeem of tool ook de doelstellingen behaald kunnen worden. Generatieve AI gebruikt enorm veel energie voor zowel het trainen als het gebruiken van het model. Onderzoek of er energiebesparende technieken toegepast kunnen worden, zoals een kleiner model, optimalisatie of een andere software-architectuur.</li>
            <li><strong>Afweging</strong>: neem het voorlopig standpunt voor het gebruik van generatieve AI bij Rijksorganisaties mee in de beslissing om generatieve AI wel of niet in te zetten.</li>
          </ul>
        type:
          - task_group
        repeatable: false

      - task: Aandachtspunten bij Deel B (implementatie en gebruik)
        id: "10.3"
        is_official_id: false
        description: |
          <strong>Technische robuustheid</strong>
          <ul>
            <li><strong>Bias</strong>: onderzoek de uitvoer van het systeem altijd op bias en breng in kaart wat de risico's van de eventuele bias zijn. De data waar een generatief AI-model op getraind is bevat vaak al een bias, en door de aard (statistisch taalmodel) van het model wordt deze bias versterkt. Softwareleveranciers halen via menselijke feedback en 'guardrails' de scherpe randen eraf, maar de bias zit nog steeds in het model.</li>
            <li><strong>Accuraatheid, betrouwbaarheid en reproduceerbaarheid</strong>: gebruik een generatief AI-model alleen voor doelen waarbij geen hoge accuraatheid, betrouwbaarheid en reproduceerbaarheid vereist is, en/of neem maatregelen in de opzet van het systeem om de kans op hallucinaties te verkleinen. Breng in kaart wat de risico's van een onbetrouwbare uitkomst zijn.</li>
            <li><strong>Technische implementatie</strong>: maak voor een extern gehost generatief AI-model contractuele afspraken over het gebruik van de input(data) van de organisatie. Bij de inkoop van een systeem moet de leverancier aantonen dat ze aan alle gestelde eisen voldoen. Het kabinetsstandpunt spreekt een voorkeur uit voor open source generatieve AI.</li>
            <li><strong>Uitlegbaarheid</strong>: gebruik generatieve AI-modellen alleen wanneer de uitlegbaarheid van resultaten geen vereiste is. Breng in kaart wat de risico's van het gebrek aan uitlegbaarheid zijn en leg uit aan medewerkers wat de beperkingen zijn.</li>
          </ul>

          <strong>Data governance</strong>
          <ul>
            <li><strong>Kwaliteit en integriteit van data</strong>: het is waarschijnlijk dat de trainingsdata van generatieve AI persoonsgegevens en auteursrechtelijk beschermd materiaal bevat. Voor de meeste AI-modellen is niet bekend welke trainingsdata gebruikt is. Vanuit de AI-verordening is transparantie vereist; vanuit de AVG mogen persoonsgegevens niet zomaar verwerkt worden.</li>
            <li><strong>Privacy</strong>: maak afspraken met de leverancier over de verwerkingsverantwoordelijkheid van de ingevoerde data (bijvoorbeeld of het gebruikt wordt als trainingsdata). Stel een goede verwerkersovereenkomst op.</li>
            <li><strong>Informatiebeveiliging</strong>: de OWASP heeft een overzicht van de 10 meest kritieke kwetsbaarheden van generatieve AI-systemen (OWASP Top 10: LLM &amp; Generative AI Security Risks).</li>
          </ul>

          <strong>Verantwoordingsplicht</strong>
          <ul>
            <li><strong>Controleerbaarheid</strong>: zie 'Uitlegbaarheid'.</li>
          </ul>
        type:
          - task_group
        repeatable: false
