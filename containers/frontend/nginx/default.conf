server {
    listen 8080;
    root /usr/share/nginx/html;

    absolute_redirect off;

    # A static site answers GET and HEAD; anything else is a probe. `if` with
    # only a `return` is one of the two uses nginx documents as safe.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # No dotfiles (.git, .env), but .well-known must stay reachable for
    # security.txt.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Security headers (NCSC/BIO2). nginx stops inheriting add_header once a
    # location adds any of its own, so every location below re-includes these
    # snippets rather than relying on inheritance — one source of truth, no drift.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-app.conf;

    # Rendered by entrypoint.sh from security.txt.template at container start.
    location = /.well-known/security.txt {
        alias /tmp/security.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
    }

    location = /config.json {
        alias /tmp/config.json;
    }

    # Never "cookies" or "*" here: those clear the whole registered domain
    # including subdomains, so they would reach sibling apps on rijksapp.nl.
    location = /clear-site-data {
        add_header Clear-Site-Data "\"storage\"" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        return 204;
    }

    # Everything Vite emits here carries a content hash in its filename, so a
    # changed file is a changed URL and the old one can be cached forever. Scoped
    # to the path rather than to extensions: /favicon.ico and /version.json are
    # unhashed and sit outside, and a newly used asset type needs no change here.
    # One add_header, no `expires`: that directive emits a Cache-Control of its
    # own, which left two of them on every asset response.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
    }

    # Standalone invulhulp (single-file SPA via viteSingleFile). Its CSP uses
    # per-build SHA-256 hashes of the inlined script/style (no 'unsafe-inline'),
    # generated by the standalone build and copied in as csp-standalone.conf.
    location /zonder-account/ {
        alias /usr/share/nginx/html/zonder-account/;
        try_files $uri /zonder-account/index.html;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-standalone.conf;
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
    }

    # The API is a separate component, so /api arriving here means a broken
    # ingress route: 404 rather than let the SPA catch-all answer it with
    # index.html.
    location ^~ /api {
        return 404;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
    }
}
